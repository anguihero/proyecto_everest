<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Resultados — Everest Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{'ev-green':'#2E7D32','ev-dark':'#1B5E20'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}
  </script>
</head>
<body class="min-h-full bg-gray-50 font-sans">
  <nav class="bg-ev-dark text-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <span class="font-bold">EVEREST EXPERIENCE</span>
      <div class="flex gap-4 items-center">
        <a id="btn-back" href="hub.html" class="text-sm text-green-100 hover:text-white">Volver</a>
        <button id="btn-logout" class="text-sm text-green-100 hover:text-white">Salir</button>
      </div>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900">Resultados accesibles</h1>
    <p id="scope-description" class="text-sm text-gray-500 mt-1 mb-6"></p>
    <div id="loading" class="text-sm text-gray-400 py-12 text-center">Cargando resultados…</div>
    <div id="error" class="hidden p-4 bg-red-50 text-red-700 rounded-xl"></div>
    <div id="empty" class="hidden text-sm text-gray-400 py-12 text-center">No hay resultados disponibles.</div>
    <div id="results-list" class="hidden space-y-3"></div>
  </main>
  <script type="module" src="./js/results-library.js"></script>
</body>
</html>
